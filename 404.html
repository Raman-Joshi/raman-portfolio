<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>404 | Raman Joshi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Fonts (same as main site) -->
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-main: #f7f8fa;
        --bg-soft: #eef1f5;
        --text-primary: #111827;
        --text-muted: #6b7280;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "DM Sans", sans-serif;
        background: var(--bg-main);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .wrapper {
        text-align: center;
        max-width: 520px;
        padding: 32px;
      }

      .code {
        font-size: 6rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--accent);
        margin-bottom: 12px;
      }

      .title {
        font-size: 1.75rem;
        font-weight: 700;
        margin-bottom: 12px;
      }

      .description {
        font-size: 1.125rem;
        line-height: 1.6;
        color: var(--text-muted);
        margin-bottom: 36px;
      }

      .btn {
        display: inline-block;
        padding: 1rem 2.5rem;
        border-radius: 500px;
        font-weight: 700;
        font-size: 1.125rem;
        text-transform: uppercase;
        text-decoration: none;
        background-color: var(--accent);
        color: #ffffff;
        transition: all 0.25s ease;
      }

      .btn:hover {
        background-color: var(--accent-hover);
        box-shadow: rgba(37, 99, 235, 0.35) 0 0 0 6px;
      }

      .footer {
        margin-top: 48px;
        font-size: 0.875rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
    </style>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="img/favicons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="img/favicons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="img/favicons/favicon-16x16.png"
    />
    <link rel="manifest" href="img/favicons/site.webmanifest" />
    <link
      rel="mask-icon"
      href="img/favicons/safari-pinned-tab.svg"
      color="#222222"
    />
    <link rel="shortcut icon" href="img/favicons/favicon.ico" />
    <meta name="msapplication-TileColor" content="#222222" />
    <meta
      name="msapplication-config"
      content="img/favicons/browserconfig.xml"
    />
    <meta name="theme-color" content="#ffffff" />
  </head>

  <body>
    <div class="wrapper">
      <div class="code">404</div>
      <div class="title">Page not found</div>
      <p class="description">
        The page you’re trying to access doesn’t exist or may have been moved.
      </p>

      <a href="/" class="btn">Back to home</a>

      <div class="footer">© Raman Joshi</div>
    </div>
  </body>
</html>
